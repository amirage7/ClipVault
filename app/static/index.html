<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipVault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23087e8b'/%3E%3Cpath d='M10 8h12v17H10zM13 5h6v5h-6z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="popup">
    <header class="popup-head pywebview-drag-region">
      <span class="drag-grip pywebview-drag-region" title="拖动窗口" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="1.4"></circle><circle cx="15" cy="7" r="1.4"></circle><circle cx="9" cy="12" r="1.4"></circle><circle cx="15" cy="12" r="1.4"></circle><circle cx="9" cy="17" r="1.4"></circle><circle cx="15" cy="17" r="1.4"></circle></svg>
      </span>
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="search" type="search" placeholder="搜索内容或来源" autocomplete="off">
      </label>
      <button class="icon-button" id="openDate" title="日期筛选" aria-label="日期筛选">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      </button>
      <button class="icon-button" id="openSettings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1-2.9 2.9-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21H10v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1-2.9-2.9.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3v-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1 2.9-2.9.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1 2.9 2.9-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1h.1v4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>
      </button>
      <button class="icon-button close" id="closePopup" title="收起" aria-label="收起">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </header>

    <nav class="filters" id="kindChips" aria-label="类型筛选">
      <button class="filter-chip active" data-kind="">全部</button>
      <button class="filter-chip" data-kind="text">文本</button>
      <button class="filter-chip" data-kind="url">链接</button>
      <button class="filter-chip" data-kind="image">图片</button>
      <button class="filter-chip" data-kind="fav">置顶</button>
    </nav>

    <nav class="smart-filters" id="smartChips" aria-label="智能分类筛选">
      <button class="smart-chip" data-smart="code">代码</button>
      <button class="smart-chip" data-smart="todo">待办</button>
      <button class="smart-chip" data-smart="prompt">提示词</button>
      <button class="smart-chip" data-smart="contact">联系方式</button>
      <button class="smart-chip" data-smart="path">文件路径</button>
      <button class="smart-chip" data-smart="sensitive">敏感内容</button>
    </nav>

    <section class="clip-list" id="list" aria-live="polite" tabindex="-1"></section>

    <footer class="popup-foot">
      <span id="summaryText">正在读取...</span>
      <span id="loadState" class="load-state" aria-live="polite"></span>
    </footer>
  </main>

  <div class="modal-mask" id="datePopover" aria-hidden="true">
    <section class="modal date-panel" role="dialog" aria-modal="true" aria-labelledby="dateTitle">
      <div class="modal-head compact-head">
        <h2 id="dateTitle">日期范围</h2>
        <button class="icon-button" id="closeDate" aria-label="关闭日期筛选"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="quick-ranges">
          <button data-range="today">今天</button>
          <button data-range="7">近 7 天</button>
          <button data-range="30">近 30 天</button>
          <button data-range="all">全部</button>
        </div>
        <div class="date-inputs">
          <label>开始日期<input id="dateStartInput" type="date"></label>
          <label>结束日期<input id="dateEndInput" type="date"></label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="secondary-button" id="clearDate">清除</button>
        <button class="primary-button" id="applyDate">应用</button>
      </div>
    </section>
  </div>

  <div class="modal-mask" id="settingsModal" aria-hidden="true">
    <section class="modal settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-button" id="closeSettings" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div class="settings-body">
        <section class="settings-section">
          <h3>快捷键</h3>
          <label class="field-label">打开剪贴板</label>
          <div class="hotkey-row"><code class="hotkey-value" id="hkValue">ctrl+e</code><button class="secondary-button" id="recBtn">录制</button></div>
          <p class="status-line" id="mainHotkeyStatus"></p>
          <label class="field-label">推送到 Obsidian</label>
          <div class="hotkey-row"><code class="hotkey-value" id="hkValue2">ctrl+alt+o</code><button class="secondary-button" id="recBtn2">录制</button></div>
          <p class="status-line" id="obsidianHotkeyStatus"></p>
        </section>

        <section class="settings-section">
          <h3>Obsidian</h3>
          <label class="field-label" for="obsidianDir">目标文件夹</label>
          <div class="hotkey-row"><input class="path-input" id="obsidianDir" type="text" readonly><button class="secondary-button" id="pickObsidianDir">选择</button></div>
        </section>

        <section class="settings-section">
          <h3>历史与隐私</h3>
          <label class="setting-toggle"><span>暂停记录</span><input id="monitorPaused" type="checkbox"></label>
          <label class="setting-toggle"><span>过滤疑似密码和验证码</span><input id="sensitiveFilter" type="checkbox"></label>
          <label class="field-label" for="excludedApps">不记录这些应用</label>
          <input class="text-input" id="excludedApps" type="text" placeholder="应用名，用逗号分隔">
          <label class="field-label" for="retentionDays">自动清理</label>
          <select class="select-input" id="retentionDays">
            <option value="0">永不自动清理</option>
            <option value="30">保留 30 天</option>
            <option value="90">保留 90 天</option>
            <option value="180">保留 180 天</option>
          </select>
        </section>

        <section class="settings-section">
          <h3>启动与存储</h3>
          <p class="status-line" id="autostartStatus"></p>
          <div class="storage-actions">
            <button class="secondary-button" id="cleanupDuplicates">清理重复项</button>
            <button class="danger-button" id="clearHistory">清空全部历史</button>
          </div>
        </section>
      </div>
      <div class="modal-foot">
        <button class="secondary-button" id="cancelSettings">取消</button>
        <button class="primary-button" id="saveSettings">保存</button>
      </div>
    </section>
  </div>

  <div class="modal-mask image-modal" id="imgModal" aria-hidden="true">
    <button class="img-close" id="imgClose" aria-label="关闭预览"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    <img class="img-full" id="imgFull" alt="图片预览" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  </div>

  <div id="toast" class="toast" role="status"></div>

  <div class="modal-mask" id="confirmModal" aria-hidden="true">
    <section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
      <div class="confirm-body"><h3 id="confirmTitle">确认</h3><p id="confirmMsg"></p></div>
      <div class="confirm-foot"><button class="secondary-button" id="confirmCancel">取消</button><button class="danger-button" id="confirmOk">确定</button></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
